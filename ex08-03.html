<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style></style>
    <title>학점 매기기(과제)</title>
    <script>
      const inp = Number(prompt("학점을 입력해주세요.", 0)); // * 1
      console.log(typeof inp, inp);
      if (inp > 100) {
        console.log("존재하지 않는 성적입니다.");
        alert("존재하지 않는 학점입니다.");
        document.write(
          `<h2>${inp}점은 존재할 수 없는 성적이므로 학점이 존재하지 않습니다.</h2>`,
        );
      } else if (inp === 100) {
        console.log("A++ 학점입니다.");
        alert("A++ 학점입니다.");
        document.write(`<h2>${inp}점이므로 A++ 학점입니다.</h2>`);
      } else if (inp >= 90) {
        console.log("A 학점입니다.");
        alert("A 학점입니다.");
        document.write(`<h2>${inp}점이므로 A 학점입니다.</h2>`);
      } else if (inp >= 80) {
        console.log("B 학점입니다.");
        alert("B 학점입니다.");
        document.write(`<h2>${inp}점이므로 B 학점입니다.</h2>`);
      } else if (inp >= 70) {
        console.log("C 학점입니다.");
        alert("C 학점입니다.");
        document.write(`<h2>${inp}점이므로 C 학점입니다.</h2>`);
      } else if (inp >= 60) {
        console.log("D 학점입니다.");
        alert("D 학점입니다.");
        document.write(`<h2>${inp}점이므로 D 학점입니다.</h2>`);
      } else {
        console.log("F 학점입니다.");
        alert("F 학점입니다.");
        document.write(`<h2>${inp}점이므로 F 학점입니다.</h2>`);
      }
    </script>
  </head>
  <body></body>
</html>
