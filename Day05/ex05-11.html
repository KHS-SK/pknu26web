    <title>260319 제출물</title>
    <style>
      :root {
        --cwidth: 293px;
        --cheight: 35px;
      }
      h2 {
        background-color: rgb(211, 194, 171);
        width: var(--cwidth);
        height: var(--cheight);
        text-align: center;
        color: white;
        margin-bottom: 3px;
      }
      section {
        width: var(--cwidth);
        background-color: beige;
        height: 210px;
        text-align: center;
        padding: 5px;
        box-sizing: border-box;
      }
      section div {
        width: 30px;
        height: 30px;
        border: 1px solid rgb(211, 194, 171);
        float: left;
        margin: 4px;
        font-size: 1.1rem;
      }
      section div:nth-of-type(7) {
        color: red !important;
      }
      section div:nth-of-type(7n + 1) {
        color: red;
      }
      section div:nth-of-type(7n) {
        color: blue;
      }
      section div:nth-of-type(n + 17):nth-of-type(-n + 19) {
        color: rgb(0, 255, 42);
      }
      section div:nth-of-type(-n + 10) {
        background-color: rgb(107, 207, 247);
      }
      section div:nth-of-type(-n + 3) {
        background-color: transparent;
      }
      section div:nth-of-type(n + 13):nth-of-type(-n + 18) {
        background-color: rgb(240, 233, 140);
      }
      section div:nth-of-type(n + 30) {
        background-color: rgb(178, 241, 159);
      }
    </style>
  </head>
