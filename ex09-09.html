<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
  </head>
  <body>
    <script>
      const inp1 = +prompt("시작값을 입력하세요");
      const inp2 = +prompt("끝값을 입력하세요");

      let sum = 0;

      for (let i = inp1; i <= inp2; i++) {
        sum += i;
      }
      document.body.innerHTML = `합산 결과는 ${sum} 입니다.`;
    </script>
  </body>
</html>
