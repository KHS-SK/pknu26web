<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>함수선언식으로 게임</title>
    <style>
      div {
        text-align: center;
      }
    </style>
  </head>
  <body>
    <!-- 나중에 하기 -->
    <!-- 1. 함수표현식으로 변경 // prolly done-->
    <!-- 2. 입력과 버튼으로 입력받아 동작하도록 변경 / prolly done -->
    <!-- 영웅의 이름: 언제나 1택 -->
    <!-- 영웅의 레벨: 6보다 크거나 같으면 영웅이 스킬을 쓰니 2개 -->
    <!-- 영웅의 스킬: fire, ice, slow / 3개 -->
    <!-- fire, ice, slow를 각각 입력할 때의 if 조건을 활성화? -->
    영웅의 이름을 입력하세요 <input type="text" id="heroName" />
    <br />
    영웅의 레벨을 입력하세요 <input type="number" id="level" />
    <br />
    영웅의 스킬을 입력하세요 <input type="text" id="cb" />
    <br />
    <button onclick="location.reload(true)">확인</button>
    <hr />
    <script>
      const lol = function (heroName, level = 1, cb = fire) {
        document.write("==================<br>");
        document.write(`${heroName}님이 ${level}레벨이 되었습니다. <br>`);
        document.write("==================<br>");

        if (level >= 6) {
          document.write(`${heroName}님이 궁극기를 씁니다.<br>`);
          cb(level);
        } else {
          document.write(`${heroName}님이 깨작 평타를 때립니다.<br>`);
        }
      };

      const fire = function (ff) {
        for (let i = 1; i < ff + 1; i++) {
          document.write(`${ff}레벨 이어서 ${i}메테오를 던집니다.<br>`);
        }
      };

      const ice = function (ii) {
        for (let i = 1; i < ii + 1; i++) {
          document.write(`${ii}레벨 이어서 ${i * 2}얼음을 던집니다.<br>`);
        }
      };

      const slow = function (ss) {
        for (let i = ss; 0 < i; i--) {
          document.write(
            `${ss}레벨 이어서 다리를 공격하여 이동속도를 ${i}% 줄입니다.<br>`,
          );
        }
      };

      lol(`${heroName}, ${level}, ${cb}`);
    </script>
  </body>
</html>
