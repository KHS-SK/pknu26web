<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>채팅창</title>
    <style>
      .box {
        height: 100vh;
        padding: 2rem;
        background-color: aliceblue;
        box-sizing: border-box;
      }
      .chat-container {
        background-color: white;
        width: 500px;
        height: 500px;
        margin: auto;
        padding: 1rem 3rem 0 3rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        transform: translateY(50%);
        border-radius: 20px;
        overflow-y: auto;
      }
      .message {
        display: flex;
        align-items: flex-end;
        margin-bottom: 1.2rem;
      }
      .message.bot {
        justify-content: flex-start;
      }
      .message.user {
        justify-content: flex-end;
      }

      .name {
        font-size: 0.8rem;
        color: #555;
        margin: 0 10px 2px;
      }
      .bubble {
        max-width: 300px;
        /* position: relative; */
        background-color: rgb(243, 238, 190);
        padding: 0.7rem 2rem;
        border-radius: 20px;
        word-break: break-word;
      }
      .user .bubble {
        background-color: yellow;
      }
      .user .name {
        text-align: right;
      }
      .chat-container::-webkit-scrollbar {
        background-color: aliceblue;
        border-radius: 0 6px 6px 0;
        width: 30px;
      }
      .chat-container::-webkit-scrollbar-thumb {
        background-color: rgb(89, 156, 233);
        border-radius: 6px;
      }
      .chat-container::-webkit-scrollbar-thumb {
        background-color: rgb(89, 156, 233);
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <h1>채팅창</h1>
    <hr />
    <a href="index.html">홈으로</a><br />
